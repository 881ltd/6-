name: Matrix OS Test

on:
  push:
    branches:
      - main

jobs:
  matrix-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show Python version
        run: python --version

      - name: Show system information
        run: |
          python -c "import platform; print('OS:', platform.system()); print('Version:', platform.version()); print('Platform:', platform.platform())"
